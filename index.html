<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正能量發射站 | Energy Heaven</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
</head>
<body>
  <!-- 密碼保護畫面 -->
  <div id="password-gate" style="position:fixed;inset:0;background:#fafafa;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px;">
    <img src="logo.jpg" alt="正能量發射站" style="width:min(680px, 95vw);height:auto;filter:contrast(1.05) saturate(1.02);">
    <div style="text-align:center;max-width:280px;width:100%;">
      <input type="password" id="site-password" placeholder="請輸入密碼" style="width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px;font-size:0.95rem;background:rgba(255,255,255,0.95);">
      <button onclick="checkPassword()" style="width:100%;background:#6b4c9a;color:#fff;border:none;padding:10px;border-radius:8px;font-size:0.95rem;cursor:pointer;font-weight:500;">進入網站</button>
      <p id="pwd-error" style="color:#d93025;font-size:0.8rem;margin-top:8px;display:none;">密碼錯誤，請再試一次</p>
    </div>
  </div>

  <header style="display:none;" id="main-header">
    <div class="container" style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;">
      <h1 class="logo" style="display:flex;align-items:center;gap:10px;margin:0;">
        <img src="logo.jpg" alt="Logo" style="height:48px;width:auto;">
        <span>正能量發射站<br><small style="font-size:0.65rem;color:#888;font-weight:normal;">Energy Heaven</small></span>
      </h1>
      <nav>
        <a href="admin.html" class="admin-link">管理後台</a>
      </nav>
    </div>
  </header>

  <div id="main-content" style="display:none;">
    <div style="display:flex;min-height:calc(100vh - 70px);">
      <!-- 左側選單 -->
      <aside style="width:180px;background:#f8f6fb;border-right:1px solid #eee;padding:24px 0;flex-shrink:0;">
        <nav style="display:flex;flex-direction:column;gap:4px;">
          <a href="#bracelets" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">手鏈</a>
          <a href="#necklaces" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">頸鏈</a>
          <a href="#custom" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">自家設計</a>
          <a href="#pillars" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">水晶柱</a>
          <a href="#clusters" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">水晶晶簇</a>
          <a href="#cleansing" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">淨化</a>
          <a href="#story" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">品牌故事</a>
          <a href="#partners" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">合作方</a>
          <a href="#contact" style="padding:10px 20px;color:#333;text-decoration:none;display:block;">聯絡我們</a>
        </nav>
      </aside>

      <!-- 主要內容 -->
      <main style="flex:1;padding:20px;">
        <section class="hero">
          <div class="hero-content">
            <h2>正能量發射 · 療癒心靈</h2>
            <p>精選高品質水晶，為你的生活帶來正能量與平靜。</p>
            <a href="#products" class="btn">探索商品</a>
          </div>
        </section>

        <section id="products" class="products-section">
          <div class="container">
            <h2 class="section-title">精選水晶</h2>
            <div id="product-grid" class="product-grid">
              <!-- 產品將由 JS 動態載入 -->
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2026 正能量發射站 · Energy Heaven · 私人展示</p>
      <p class="note">此頁面僅供內部使用，商品資料儲存於瀏覽器本地。</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
